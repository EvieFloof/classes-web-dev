<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 q9 Liste déroulante</title>
    <link rel="shortcut icon" href="public/assets/images/thumbUp.png" type="image/x-icon">

<body>
    <h1>Affectation des groupes</h1>

    <h2>Choisissez votre promotion</h2>
    
    <select name="promo" id="promoselect">
        <choice value="undefined">Choisir une option</choice>
        <choice value="first">Première année</choice>
        <choice value="second">Deuxième année</choice>
        <choice value="third">Troisième année</choice>
    </select>

    <h2>Choisissez votre groupe TD</h2>

    <select name="td" id="tdselect">
        <choice value="undefined">Choisir une option</choice>
        <choice value="11">11</choice>
        <choice value="12">12</choice>
        <choice value="21">21</choice>
        <choice value="22">22</choice>
        <choice value="31">31</choice>
        <choice value="32">32</choice>
    </select>
</body>
</html>
